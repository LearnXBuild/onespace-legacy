<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>onespace</title>
  <meta name="theme-color" content="#f4f6f8">
  
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Cdefs%3E%3ClinearGradient id='p' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' stop-color='%236366f1'/%3E%3Cstop offset='100%25' stop-color='%234338ca'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='512' height='512' rx='130' fill='url(%23p)'/%3E%3Crect x='110' y='110' width='292' height='292' rx='50' fill='none' stroke='%23ffffff' stroke-width='24' stroke-dasharray='380 40' stroke-linecap='round' opacity='0.35'/%3E%3Ccircle cx='256' cy='256' r='64' fill='%23ffffff'/%3E%3Cpath d='M256 160v60M256 292v60M160 256h60M292 256h60' stroke='%23ffffff' stroke-width='20' stroke-linecap='round'/%3E%3C/svg%3E">
  
  <!-- ES5 & Legacy Browser Polyfills -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/core-js/2.6.12/core.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/fetch/2.0.4/fetch.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <style>
    /* Static CSS Fallbacks + CSS Variables */
    :root {
      --bg: #f4f6f8;
      --surface: #ffffff;
      --surface-hover: #f8fafc;
      --border: #e2e8f0;
      --border-dark: #cbd5e1;
      --text: #1e293b;
      --text-muted: #64748b;
      --accent-primary: #6366f1;
      --signal: #d97706;
      --signal-bar: #cbd5e1;
    }

    * { -webkit-box-sizing: border-box; -moz-box-sizing: border-box; box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { background: #f4f6f8; color: #1e293b; display: -webkit-box; display: -webkit-flex; display: flex; height: 100vh; overflow: hidden; -webkit-box-orient: horizontal; -webkit-flex-direction: row; flex-direction: row; }

    #ptr-indicator {
      position: fixed;
      top: -50px;
      left: 50%;
      -webkit-transform: translateX(-50%);
      transform: translateX(-50%);
      background: #ffffff;
      color: #1e293b;
      border: 1px solid #cbd5e1;
      padding: 6px 16px;
      border-radius: 99px;
      font-size: 11px;
      font-weight: bold;
      z-index: 999;
      display: none;
    }
    #ptr-indicator.visible { top: 18px; display: block; }

    aside { width: 220px; border-right: 1px solid #e2e8f0; background: #ffffff; display: -webkit-box; display: -webkit-flex; display: flex; -webkit-box-orient: vertical; -webkit-flex-direction: column; flex-direction: column; padding: 16px 12px; -webkit-flex-shrink: 0; flex-shrink: 0; }
    main { -webkit-box-flex: 1; -webkit-flex: 1; flex: 1; display: -webkit-box; display: -webkit-flex; display: flex; -webkit-box-orient: vertical; -webkit-flex-direction: column; flex-direction: column; overflow-y: auto; background: #f4f6f8; padding-bottom: 80px; width: 100%; min-width: 0; }
    
    .sidebar-header { display: -webkit-box; display: -webkit-flex; display: flex; -webkit-box-pack: justify; -webkit-justify-content: space-between; justify-content: space-between; -webkit-box-align: center; -webkit-align-items: center; align-items: center; margin-bottom: 20px; }
    .logo { font-size: 15px; font-weight: bold; color: #1e293b; text-transform: lowercase; }

    .profile-icon-btn { background: #f3e8ff; border: 1px solid #d8b4fe; border-radius: 50%; width: 34px; height: 34px; line-height: 32px; text-align: center; cursor: pointer; font-size: 14px; }

    nav.sidebar-nav { display: -webkit-box; display: -webkit-flex; display: flex; -webkit-box-orient: vertical; -webkit-flex-direction: column; flex-direction: column; }
    nav.sidebar-nav button { display: block; width: 100%; text-align: left; padding: 10px 12px; background: transparent; border: 1px solid transparent; border-radius: 10px; font-size: 13px; font-weight: bold; color: #64748b; cursor: pointer; margin-bottom: 4px; }
    nav.sidebar-nav button.active { background: #6366f1; color: #ffffff; }

    .content-section { display: none; padding: 18px 14px; max-width: 860px; margin: 0 auto; width: 100%; }
    .content-section.active { display: block; }

    header.workspace-header { display: -webkit-box; display: -webkit-flex; display: flex; -webkit-box-pack: justify; -webkit-justify-content: space-between; justify-content: space-between; -webkit-box-align: center; -webkit-align-items: center; align-items: center; margin-bottom: 16px; padding-bottom: 12px; border-bottom: 1px solid #e2e8f0; }
    h1.section-title { font-size: 15px; font-weight: bold; text-transform: uppercase; color: #1e293b; }

    .btn { background: #1e293b; color: #ffffff; border: none; padding: 8px 14px; border-radius: 99px; font-size: 12px; font-weight: bold; cursor: pointer; display: inline-block; text-decoration: none; }
    .btn-secondary { background: #ffffff; color: #1e293b; border: 1px solid #cbd5e1; }
    .btn-danger { background: #ef4444; color: #ffffff; }
    .btn-sm { padding: 4px 10px; font-size: 11px; }

    input[type="text"], input[type="date"], input[type="time"], input[type="number"], select, textarea { 
      border: 1px solid #e2e8f0; 
      border-radius: 6px; 
      padding: 8px 10px; 
      font-size: 13px; 
      width: 100%; 
      background: #ffffff; 
      color: #1e293b; 
      margin-bottom: 8px;
    }

    .filter-bar { background: #ffffff; padding: 12px; border-radius: 12px; border: 1px solid #e2e8f0; margin-bottom: 14px; }
    .filter-pills { overflow-x: auto; white-space: nowrap; padding-top: 6px; }
    .filter-chip { font-size: 11px; font-weight: bold; padding: 4px 10px; border-radius: 99px; border: 1px solid #e2e8f0; background: #ffffff; cursor: pointer; color: #64748b; display: inline-block; margin-right: 4px; }
    .filter-chip.active { background: #1e293b; color: #ffffff; border-color: #1e293b; }

    .stack-section-card { background: #ffffff; border: 1px solid #e2e8f0; border-radius: 12px; margin-bottom: 12px; overflow: hidden; }
    .stack-section-header { padding: 12px 14px; cursor: pointer; background: #f8fafc; border-bottom: 1px solid #e2e8f0; font-weight: bold; font-size: 13px; }
    .stack-content { padding: 12px; }
    .stack-section-card.collapsed .stack-content { display: none; }

    .reminder-card { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 8px; padding: 10px; margin-bottom: 8px; }
    .reminder-row { display: -webkit-box; display: -webkit-flex; display: flex; -webkit-box-align: start; -webkit-align-items: flex-start; align-items: flex-start; }
    .reminder-title-text { font-size: 13px; font-weight: bold; -webkit-box-flex: 1; -webkit-flex: 1; flex: 1; padding: 0 8px; }
    .reminder-card.completed .reminder-title-text { text-decoration: line-through; color: #64748b; }

    .pill { display: inline-block; font-size: 10px; padding: 2px 6px; border-radius: 99px; font-weight: bold; margin-right: 4px; }
    
    .bento-card { background: #ffffff; border: 1px solid #e2e8f0; border-radius: 12px; padding: 14px; margin-bottom: 12px; }
    .code-box { background: #0f172a; color: #f1f5f9; border-radius: 8px; padding: 12px; font-size: 11px; overflow-x: auto; margin-bottom: 12px; }
    .code-box pre { margin: 0; }

    .schedule-bucket-grid { width: 100%; }
    .schedule-bucket-card { background: #ffffff; border: 1px solid #e2e8f0; border-radius: 10px; padding: 12px; margin-bottom: 10px; }

    .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0, 0, 0, 0.6); display: none; z-index: 1000; overflow-y: auto; padding: 14px; }
    .modal { background: #ffffff; border-radius: 10px; max-width: 440px; margin: 30px auto; padding: 18px; }

    @media (max-width: 640px) {
      body { -webkit-box-orient: vertical; -webkit-flex-direction: column; flex-direction: column; }
      aside { display: none; }
      .mobile-nav { position: fixed; bottom: 0; left: 0; right: 0; height: 50px; background: #ffffff; border-top: 1px solid #e2e8f0; display: -webkit-box; display: -webkit-flex; display: flex; z-index: 500; }
      .mobile-nav button { -webkit-box-flex: 1; -webkit-flex: 1; flex: 1; background: transparent; border: none; font-size: 11px; font-weight: bold; color: #64748b; }
      .mobile-nav button.active { color: #6366f1; }
    }
    @media (min-width: 641px) {
      .mobile-nav { display: none; }
    }
  </style>
</head>
<body>

  <div id="ptr-indicator">↓ Pull down to refresh</div>

  <!-- DESKTOP SIDEBAR -->
  <aside>
    <div class="sidebar-header">
      <div class="logo"><strong>onespace</strong></div>
      <button class="profile-icon-btn" onclick="openProfileModal()">👤</button>
    </div>
    <nav class="sidebar-nav">
      <button class="nav-btn active" onclick="switchTab('calendar', this)">Schedule</button>
      <button class="nav-btn" onclick="switchTab('tasks', this)">Tasks & Backlog</button>
      <button class="nav-btn" onclick="switchTab('learning', this)">Learning</button>
      <button class="nav-btn" onclick="switchTab('signals', this)">Signals Feed</button>
    </nav>
  </aside>

  <main id="main-scroll-container">
    <!-- 1. SCHEDULE TAB -->
    <section id="sec-calendar" class="content-section active">
      <header class="workspace-header">
        <h1 class="section-title">SCHEDULE CALENDAR</h1>
        <div>
          <button class="btn btn-secondary btn-sm" onclick="openCalendarEventModal(null)">+ Event</button>
        </div>
      </header>

      <div style="background:#ffffff; padding:10px; border-radius:10px; border:1px solid #e2e8f0; margin-bottom:12px;">
        <input type="date" id="cal-view-date" onchange="renderScheduleCalendar()" style="width: 140px; margin: 0;">
        <span style="font-weight:bold; font-size:12px; color:#64748b; margin-left:8px;" id="cal-day-label"></span>
      </div>

      <div id="calendar-render-area"></div>
    </section>

    <!-- 2. TASKS TAB -->
    <section id="sec-tasks" class="content-section">
      <header class="workspace-header">
        <div>
          <select id="task-project-filter" onchange="filterTasksByProjectSelect()" style="font-size:13px; font-weight:bold; width:auto; margin:0;">
            <option value="ALL">ALL PROJECTS</option>
          </select>
        </div>
        <div>
          <button class="btn btn-secondary btn-sm" onclick="openProjectManagerModal()">📂 Projects</button>
          <button class="btn btn-sm" onclick="openTaskModal()">+ Add Task</button>
        </div>
      </header>

      <div class="filter-bar">
        <input type="text" id="search-input" placeholder="Search tasks..." onkeyup="handleSearchInput()">
        <div class="filter-pills" id="tag-filters"></div>
      </div>

      <div>
        <div class="stack-section-card" id="card-section-focus">
          <div class="stack-section-header" onclick="toggleSectionCollapse('focus')">
            ⚡ Focus / In Progress (<span id="badge-focus">0</span>)
          </div>
          <div class="stack-content" id="list-focus"></div>
        </div>

        <div class="stack-section-card" id="card-section-backlog">
          <div class="stack-section-header" onclick="toggleSectionCollapse('backlog')">
            📋 Backlog & To Do (<span id="badge-backlog">0</span>)
          </div>
          <div class="stack-content" id="list-backlog"></div>
        </div>

        <div class="stack-section-card collapsed" id="card-section-completed">
          <div class="stack-section-header" onclick="toggleSectionCollapse('completed')">
            ✅ Completed (<span id="badge-completed">0</span>)
          </div>
          <div class="stack-content" id="list-completed"></div>
        </div>
      </div>
    </section>

    <!-- 3. LEARNING TAB -->
    <section id="sec-learning" class="content-section">
      <header class="workspace-header">
        <h1 class="section-title">LEARNING HUB</h1>
        <div>
          <button class="btn btn-secondary btn-sm" onclick="renderLearningHub()">↻ Refresh</button>
        </div>
      </header>

      <div class="filter-pills" id="learning-track-pills" style="margin-bottom:12px;">
        <span class="filter-chip active" onclick="setLearningTrack('DSA', this)">DSA</span>
        <span class="filter-chip" onclick="setLearningTrack('HLD', this)">HLD</span>
      </div>

      <div id="learning-bento-container"></div>
    </section>

    <!-- 4. SIGNALS TAB -->
    <section id="sec-signals" class="content-section">
      <header class="workspace-header">
        <h1 class="section-title">SIGNALS FEED</h1>
        <div>
          <button class="btn btn-secondary btn-sm" onclick="refreshSignalsFromTop()">↻ Refresh</button>
        </div>
      </header>

      <div id="bento-loading" style="text-align:center; padding:20px; color:#64748b; font-size:12px;">Connecting to signals...</div>
      <div id="bento-signals-container"></div>
      <div id="signals-load-more" style="text-align:center; padding:12px;">
        <button class="btn btn-secondary btn-sm" onclick="fetchSupabaseSignals(false)">Load More</button>
      </div>
    </section>
  </main>

  <!-- MOBILE BOTTOM NAV -->
  <div class="mobile-nav">
    <button class="nav-btn active" onclick="switchTab('calendar', this)">Schedule</button>
    <button class="nav-btn" onclick="switchTab('tasks', this)">Tasks</button>
    <button class="nav-btn" onclick="switchTab('learning', this)">Learning</button>
    <button class="nav-btn" onclick="switchTab('signals', this)">Signals</button>
  </div>

  <!-- TASK MODAL -->
  <div class="modal-overlay" id="task-modal">
    <div class="modal">
      <h3 style="font-size:14px; margin-bottom:10px;" id="modal-title">Create Task</h3>
      <input type="hidden" id="edit-task-id">
      <input type="text" id="t-title" placeholder="Task Title">
      <textarea id="t-desc" placeholder="Description (optional)" rows="2"></textarea>
      
      <label style="font-size:11px; font-weight:bold; color:#64748b;">PROJECT:</label>
      <select id="t-project"></select>

      <label style="font-size:11px; font-weight:bold; color:#64748b;">STATUS:</label>
      <select id="t-status">
        <option value="in_progress">⚡ Focus / In Progress</option>
        <option value="todo">📋 Backlog & To Do</option>
        <option value="done">✅ Completed</option>
      </select>

      <label style="font-size:11px; font-weight:bold; color:#64748b;">TAGS (comma separated):</label>
      <input type="text" id="t-tags" placeholder="urgent, review">

      <div style="text-align:right; margin-top:10px;">
        <button class="btn btn-secondary" onclick="closeModal('task-modal')">Cancel</button>
        <button class="btn" onclick="saveTask()">Save</button>
      </div>
    </div>
  </div>

  <!-- EVENT MODAL -->
  <div class="modal-overlay" id="calendar-modal">
    <div class="modal">
      <h3 style="font-size:14px; margin-bottom:10px;" id="cal-modal-title">Event Block</h3>
      <input type="hidden" id="cal-edit-id">
      <input type="text" id="cal-title" placeholder="Event Title">
      <input type="date" id="cal-date">
      
      <label style="font-size:11px; font-weight:bold; color:#64748b;">TIME BUCKET:</label>
      <select id="cal-bucket-select">
        <option value="morning">🌅 Morning (till 12 PM)</option>
        <option value="afternoon">☀️ Afternoon (12 PM - 4 PM)</option>
        <option value="evening">🌆 Evening (4 PM - 8 PM)</option>
        <option value="others">🌙 Others (8 PM onwards)</option>
      </select>

      <label style="font-size:11px; font-weight:bold; color:#64748b;">ASSIGN PROJECT:</label>
      <select id="cal-project-select"></select>

      <div style="text-align:right; margin-top:10px;">
        <button class="btn btn-danger btn-sm" id="cal-delete-btn" style="display:none; float:left;" onclick="deleteCalendarEvent()">Delete</button>
        <button class="btn btn-secondary" onclick="closeModal('calendar-modal')">Cancel</button>
        <button class="btn" onclick="saveCalendarEvent()">Save</button>
      </div>
    </div>
  </div>

  <script>
    /* ==========================================================================
       ES5 COMPLIANT JS ENGINE FOR ANDROID 4.2 JELLY BEAN
       ========================================================================== */
    var SUPABASE_URL = 'https://srfhubczkyqgryphkpfb.supabase.co';
    var SUPABASE_ANON_KEY = 'sb_publishable_WNpgnNEFi329sp-lnqRPdg_huw4yojT';
    var db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    var ALL_PROJECTS = [];
    var ALL_TASKS = [];
    var ALL_EVENTS = [];
    var ALL_ARTICLES = [];
    var CURRENT_DRILL = null;

    var SIGNALS_PAGE_SIZE = 5;
    var signalsOffset = 0;
    var isFetchingSignals = false;
    var activeLearningTrack = "DSA";
    var selectedFilterTags = [];

    function escapeHtml(str) {
      if (!str) return '';
      return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;');
    }

    function formatDateLocal(dateObj) {
      var year = dateObj.getFullYear();
      var month = String(dateObj.getMonth() + 1);
      if (month.length < 2) month = '0' + month;
      var day = String(dateObj.getDate());
      if (day.length < 2) day = '0' + day;
      return year + '-' + month + '-' + day;
    }

    function getProjectById(projId) {
      if (!projId) return null;
      for (var i = 0; i < ALL_PROJECTS.length; i++) {
        if (Number(ALL_PROJECTS[i].id) === Number(projId)) return ALL_PROJECTS[i];
      }
      return null;
    }

    function switchTab(tab, element) {
      var navBtns = document.querySelectorAll('.nav-btn');
      for (var i = 0; i < navBtns.length; i++) {
        navBtns[i].className = navBtns[i].className.replace(/\bactive\b/g, '');
      }

      var sections = document.querySelectorAll('.content-section');
      for (var j = 0; j < sections.length; j++) {
        sections[j].className = sections[j].className.replace(/\bactive\b/g, '');
      }

      if (element) {
        element.className += ' active';
      }

      var sec = document.getElementById('sec-' + tab);
      if (sec) sec.className += ' active';

      if (tab === 'calendar') renderScheduleCalendar();
      if (tab === 'tasks') renderTaskStack();
      if (tab === 'learning') renderLearningHub();
      if (tab === 'signals') {
        if (ALL_ARTICLES.length === 0) fetchSupabaseSignals(true);
        else renderBentoSignals();
      }
    }

    function syncAllSupabaseData() {
      Promise.all([
        db.from('projects').select('*').order('name', { ascending: true }),
        db.from('tasks').select('*').order('id', { ascending: false }),
        db.from('schedule_events').select('*').order('start_time', { ascending: true })
      ]).then(function(results) {
        if (results[0].data) ALL_PROJECTS = results[0].data;
        if (results[1].data) ALL_TASKS = results[1].data;
        if (results[2].data) ALL_EVENTS = results[2].data;

        updateProjectDropdowns();
        renderTagFilters();
        renderTaskStack();
        renderScheduleCalendar();
      }).catch(function(err) {
        console.error("Supabase sync error:", err);
      });
    }

    function updateProjectDropdowns() {
      var taskProj = document.getElementById('task-project-filter');
      var calProj = document.getElementById('cal-project-select');
      var tModalProj = document.getElementById('t-project');

      var filterOpts = '<option value="ALL">ALL PROJECTS</option>';
      var selectOpts = '';

      for (var i = 0; i < ALL_PROJECTS.length; i++) {
        var p = ALL_PROJECTS[i];
        filterOpts += '<option value="' + p.id + '">' + escapeHtml(p.name.toUpperCase()) + '</option>';
        selectOpts += '<option value="' + p.id + '">' + escapeHtml(p.name) + '</option>';
      }

      if (taskProj) taskProj.innerHTML = filterOpts;
      if (calProj) calProj.innerHTML = selectOpts;
      if (tModalProj) tModalProj.innerHTML = selectOpts;
    }

    function toggleSectionCollapse(sectionId) {
      var card = document.getElementById('card-section-' + sectionId);
      if (card) {
        if (card.className.indexOf('collapsed') !== -1) {
          card.className = card.className.replace(/\bcollapsed\b/g, '');
        } else {
          card.className += ' collapsed';
        }
      }
    }

    function renderTaskStack() {
      var searchQuery = (document.getElementById('search-input').value || '').toLowerCase();
      var selectedFilter = document.getElementById('task-project-filter').value;
      var isAll = !selectedFilter || selectedFilter === 'ALL';

      var focusList = document.getElementById('list-focus');
      var backlogList = document.getElementById('list-backlog');
      var completedList = document.getElementById('list-completed');

      focusList.innerHTML = '';
      backlogList.innerHTML = '';
      completedList.innerHTML = '';

      var focusCount = 0, backlogCount = 0, completedCount = 0;

      for (var i = 0; i < ALL_TASKS.length; i++) {
        var task = ALL_TASKS[i];
        if (task.parent_id) continue;

        var taskProj = getProjectById(task.project_id);
        var taskProjId = taskProj ? String(taskProj.id) : null;

        if (!isAll && taskProjId !== selectedFilter) continue;
        if (searchQuery && task.title.toLowerCase().indexOf(searchQuery) === -1) continue;

        var status = task.status || 'todo';
        var projName = taskProj ? taskProj.name : (task.project || 'General');

        var card = document.createElement('div');
        card.className = 'reminder-card ' + (status === 'done' ? 'completed' : '');
        card.innerHTML = 
          '<div class="reminder-row">' +
            '<input type="checkbox" ' + (status === 'done' ? 'checked' : '') + ' onchange="toggleTaskStatus(' + task.id + ')">' +
            '<div class="reminder-title-text">' + escapeHtml(task.title) + '</div>' +
            '<button class="btn btn-secondary btn-sm" onclick="openTaskModal(' + task.id + ')">✏️</button>' +
          '</div>' +
          '<div style="margin-top:4px;">' +
            '<span class="pill" style="background:#e2e8f0;">' + escapeHtml(projName) + '</span>' +
          '</div>';

        if (status === 'in_progress') {
          focusList.appendChild(card);
          focusCount++;
        } else if (status === 'done') {
          completedList.appendChild(card);
          completedCount++;
        } else {
          backlogList.appendChild(card);
          backlogCount++;
        }
      }

      document.getElementById('badge-focus').innerText = focusCount;
      document.getElementById('badge-backlog').innerText = backlogCount;
      document.getElementById('badge-completed').innerText = completedCount;
    }

    function toggleTaskStatus(taskId) {
      var task = null;
      for (var i = 0; i < ALL_TASKS.length; i++) {
        if (Number(ALL_TASKS[i].id) === Number(taskId)) { task = ALL_TASKS[i]; break; }
      }
      if (!task) return;

      var nextStatus = (task.status === 'done') ? 'todo' : 'done';
      task.status = nextStatus;
      renderTaskStack();

      db.from('tasks').update({ status: nextStatus, updated_at: new Date().toISOString() }).eq('id', taskId).then(function() {});
    }

    function openTaskModal(taskId) {
      updateProjectDropdowns();
      if (taskId) {
        var task = null;
        for (var i = 0; i < ALL_TASKS.length; i++) {
          if (Number(ALL_TASKS[i].id) === Number(taskId)) { task = ALL_TASKS[i]; break; }
        }
        document.getElementById('modal-title').innerText = 'Edit Task';
        document.getElementById('edit-task-id').value = task.id;
        document.getElementById('t-title').value = task.title;
        document.getElementById('t-desc').value = task.description || '';
        document.getElementById('t-project').value = task.project_id || '';
        document.getElementById('t-status').value = task.status || 'todo';
      } else {
        document.getElementById('modal-title').innerText = 'Create Task';
        document.getElementById('edit-task-id').value = '';
        document.getElementById('t-title').value = '';
        document.getElementById('t-desc').value = '';
        document.getElementById('t-status').value = 'in_progress';
      }
      document.getElementById('task-modal').style.display = 'block';
    }

    function saveTask() {
      var title = document.getElementById('t-title').value;
      if (!title) return;
      var editId = document.getElementById('edit-task-id').value;
      var status = document.getElementById('t-status').value;
      var description = document.getElementById('t-desc').value;
      var project_id = Number(document.getElementById('t-project').value);
      var projObj = getProjectById(project_id);
      var project = projObj ? projObj.name : 'General';

      closeModal('task-modal');

      if (editId) {
        db.from('tasks').update({
          title: title, description: description, project_id: project_id, project: project, status: status, updated_at: new Date().toISOString()
        }).eq('id', editId).then(function() {
          syncAllSupabaseData();
        });
      } else {
        db.from('tasks').insert([{
          title: title, description: description, project_id: project_id, project: project, status: status, tags: []
        }]).then(function() {
          syncAllSupabaseData();
        });
      }
    }

    function renderScheduleCalendar() {
      var viewInput = document.getElementById('cal-view-date');
      if (!viewInput.value) viewInput.value = formatDateLocal(new Date());

      var dateStr = viewInput.value.split('T')[0];
      var area = document.getElementById('calendar-render-area');
      area.innerHTML = '';

      var buckets = [
        { id: 'morning', title: '🌅 Morning' },
        { id: 'afternoon', title: '☀️ Afternoon' },
        { id: 'evening', title: '🌆 Evening' },
        { id: 'others', title: '🌙 Others' }
      ];

      var dayEvents = [];
      for (var i = 0; i < ALL_EVENTS.length; i++) {
        if (ALL_EVENTS[i].event_date && String(ALL_EVENTS[i].event_date).split('T')[0] === dateStr) {
          dayEvents.push(ALL_EVENTS[i]);
        }
      }

      var html = '<div class="schedule-bucket-grid">';
      for (var b = 0; b < buckets.length; b++) {
        var bucket = buckets[b];
        var bucketEvents = [];
        for (var e = 0; e < dayEvents.length; e++) {
          if ((dayEvents[e].time_bucket || 'morning').toLowerCase() === bucket.id) {
            bucketEvents.push(dayEvents[e]);
          }
        }

        html += '<div class="schedule-bucket-card">' +
          '<div style="font-weight:bold; margin-bottom:8px;">' + bucket.title + ' (' + bucketEvents.length + ')</div>';

        if (bucketEvents.length === 0) {
          html += '<div style="font-size:11px; color:#64748b;">No events scheduled.</div>';
        } else {
          for (var k = 0; k < bucketEvents.length; k++) {
            var evt = bucketEvents[k];
            html += '<div class="reminder-card" style="margin-bottom:4px;">' +
              '<div style="font-weight:bold; font-size:12px;">' + escapeHtml(evt.title) + '</div>' +
            '</div>';
          }
        }
        html += '</div>';
      }
      html += '</div>';
      area.innerHTML = html;
    }

    function openCalendarEventModal(eventId) {
      updateProjectDropdowns();
      document.getElementById('cal-edit-id').value = '';
      document.getElementById('cal-title').value = '';
      document.getElementById('cal-date').value = document.getElementById('cal-view-date').value || formatDateLocal(new Date());
      document.getElementById('calendar-modal').style.display = 'block';
    }

    function saveCalendarEvent() {
      var title = document.getElementById('cal-title').value;
      if (!title) return;
      var event_date = document.getElementById('cal-date').value;
      var time_bucket = document.getElementById('cal-bucket-select').value;
      var project_id = Number(document.getElementById('cal-project-select').value);
      var projObj = getProjectById(project_id);

      closeModal('calendar-modal');

      db.from('schedule_events').insert([{
        title: title,
        event_date: event_date,
        time_bucket: time_bucket,
        project_id: project_id,
        project: projObj ? projObj.name : 'General'
      }]).then(function() {
        syncAllSupabaseData();
      });
    }

    function fetchSupabaseSignals(isReset) {
      if (isFetchingSignals) return;
      isFetchingSignals = true;

      if (isReset) {
        signalsOffset = 0;
        document.getElementById('bento-loading').style.display = 'block';
      }

      var from = signalsOffset;
      var to = signalsOffset + SIGNALS_PAGE_SIZE - 1;

      db.from('articles').select('*').order('date', { ascending: false }).range(from, to).then(function(res) {
        isFetchingSignals = false;
        document.getElementById('bento-loading').style.display = 'none';
        var fetched = res.data || [];

        if (isReset) {
          ALL_ARTICLES = fetched;
        } else {
          ALL_ARTICLES = ALL_ARTICLES.concat(fetched);
        }

        signalsOffset += SIGNALS_PAGE_SIZE;
        renderBentoSignals();
      }).catch(function(err) {
        isFetchingSignals = false;
        document.getElementById('bento-loading').innerText = 'Error loading signals.';
      });
    }

    function renderBentoSignals() {
      var container = document.getElementById('bento-signals-container');
      container.innerHTML = '';

      for (var i = 0; i < ALL_ARTICLES.length; i++) {
        var art = ALL_ARTICLES[i];
        var card = document.createElement('div');
        card.className = 'bento-card';
        card.innerHTML = 
          '<div style="font-size:11px; color:#64748b; margin-bottom:4px;">' + escapeHtml(art.source || 'Signal') + ' • ' + (art.date || '') + '</div>' +
          '<h3 style="font-size:14px; margin-bottom:6px;"><a href="' + (art.url || '#') + '" target="_blank" style="color:#1e293b; text-decoration:none;">' + escapeHtml(art.headline) + '</a></h3>' +
          '<p style="font-size:12px; line-height:1.5; color:#334155;">' + escapeHtml(art.body) + '</p>';
        container.appendChild(card);
      }
    }

    function renderLearningHub() {
      var container = document.getElementById('learning-bento-container');
      container.innerHTML = '<div style="text-align:center; padding:20px; font-size:12px; color:#64748b;">Loading pattern...</div>';

      db.from('dsa_daily_drills').select('*').order('drill_date', { ascending: false }).limit(1).then(function(res) {
        if (!res.data || res.data.length === 0) {
          container.innerHTML = '<div class="bento-card">No active drill found.</div>';
          return;
        }
        var drill = res.data[0];
        container.innerHTML = 
          '<div class="bento-card">' +
            '<div style="font-size:11px; color:#6366f1; font-weight:bold;">PATTERN OF THE DAY</div>' +
            '<h2 style="font-size:15px; margin:4px 0 8px;">' + escapeHtml(drill.pattern_name) + '</h2>' +
            '<div class="code-box"><pre><code>' + escapeHtml(drill.template_code || '// No template code') + '</code></pre></div>' +
          '</div>';
      });
    }

    function setLearningTrack(track, element) {
      activeLearningTrack = track;
      var chips = document.querySelectorAll('#learning-track-pills .filter-chip');
      for (var i = 0; i < chips.length; i++) chips[i].className = chips[i].className.replace(/\bactive\b/g, '');
      if (element) element.className += ' active';
      renderLearningHub();
    }

    function handleSearchInput() { renderTaskStack(); }
    function renderTagFilters() {}
    function filterTasksByProjectSelect() { renderTaskStack(); }
    function openProfileModal() {}
    function openProjectManagerModal() {}
    function refreshSignalsFromTop() { fetchSupabaseSignals(true); }
    function closeModal(id) { document.getElementById(id).style.display = 'none'; }

    // Init
    syncAllSupabaseData();
  </script>
</body>
</html>
